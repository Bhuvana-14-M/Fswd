<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Order Form</title>
</head>
<body>

<form method="get">

    <label for="customer">Your name:</label>
    <input type="text" id="customer" name="customer">

    <br><br>

    <label for="phone">Phone:</label>
    <input type="tel" id="phone" name="phone">

    <br><br>

    <fieldset>
        <legend>Choose your dish</legend>

        <label for="idli">
            <input type="radio" id="idli" name="dish" value="Idli ₹30" checked>
            Idli ₹30
        </label>

        <label for="thali">
            <input type="radio" id="thali" name="dish" value="Veg Thali ₹60">
            Veg Thali ₹60
        </label>

        <label for="curdRice">
            <input type="radio" id="curdRice" name="dish" value="Curd Rice ₹35">
            Curd Rice ₹35
        </label>

    </fieldset>

    <br>

    <label for="plates">How many plates?</label>
    <input type="number" id="plates" name="plates" min="1" max="10" value="1">

    <br><br>

    <label for="notes">Anything else?</label>
    <br>
    <textarea id="notes" name="notes" rows="5" cols="40"
        placeholder="less spicy please..."></textarea>

    <br><br>

    <button type="submit">Place order</button>

</form>

</body>
</html>
